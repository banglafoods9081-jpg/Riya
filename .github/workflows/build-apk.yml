name: Build Riya APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMGR" "platforms;android-36.1" || true
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle 9.3.1 on PATH
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Generate debug keystore for APK signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload Riya APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riya-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
